<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Ricerca Senza Quota API</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-dim: #aaaaaa;
      --accent: #ff0055;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }

    h2 { text-align: center; color: var(--accent); }

    .search-box {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #222;
      color: #fff;
      box-sizing: border-box;
      outline: none;
    }

    .search-box:focus { border-color: var(--accent); }

    .results-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-card {
      display: flex;
      align-items: center;
      background-color: var(--card-bg);
      padding: 10px;
      border-radius: 8px;
      gap: 12px;
    }

    .video-thumb {
      width: 100px;
      height: 56px;
      object-fit: cover;
      border-radius: 4px;
      background: #333;
    }

    .video-info { flex: 1; overflow: hidden; }

    .video-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .video-meta {
      font-size: 12px;
      color: var(--text-dim);
    }

    .status-msg {
      text-align: center;
      color: var(--text-dim);
      padding: 20px;
    }
  </style>
</head>
<body>

  <h2>Ricerca YouTube Gratuita (Invidious API)</h2>
  <input type="text" id="searchInput" class="search-box" placeholder="Cerca un brano o artista..." />

  <div id="results" class="results-container">
    <div class="status-msg">Digita qualcosa per iniziare la ricerca</div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');

    // Endpoint Invidious e Piped pubblici attivi ed estremamente permissivi con il CORS
    const API_SERVERS = [
      { type: 'invidious', url: 'https://inv.riverside.rocks' },
      { type: 'invidious', url: 'https://invidious.nerqv.ps' },
      { type: 'invidious', url: 'https://vid.puffyan.us' },
      { type: 'piped',     url: 'https://pipedapi.mha.fi' }
    ];

    let debounceTimer = null;

    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();

      if (query.length < 2) {
        resultsContainer.innerHTML = `<div class="status-msg">Digita qualcosa per iniziare la ricerca</div>`;
        return;
      }

      debounceTimer = setTimeout(() => searchFreeAPI(query), 500);
    });

    async function searchFreeAPI(query) {
      resultsContainer.innerHTML = `<div class="status-msg">Ricerca in corso...</div>`;

      for (const server of API_SERVERS) {
        try {
          let reqUrl = '';
          if (server.type === 'invidious') {
            reqUrl = `${server.url}/api/v1/search?q=${encodeURIComponent(query)}&type=video`;
          } else {
            reqUrl = `${server.url}/search?q=${encodeURIComponent(query)}&filter=videos`;
          }

          const res = await fetch(reqUrl);
          if (!res.ok) continue;

          const data = await res.json();
          const parsedResults = parseResponse(data, server.type);

          if (parsedResults.length > 0) {
            renderResults(parsedResults);
            return; // Trovato e mostrato con successo
          }

        } catch (err) {
          console.warn(`Server ${server.url} non raggiungibile (CORS/Network), provo il successivo...`);
        }
      }

      resultsContainer.innerHTML = `<div class="status-msg" style="color:#ff5555;">Tutti i server di riserva sono momentaneamente irraggiungibili.</div>`;
    }

    function parseResponse(data, type) {
      if (!Array.isArray(data) && !data.items) return [];

      if (type === 'invidious') {
        return (data || []).map(item => ({
          id: item.videoId,
          title: item.title,
          uploader: item.author,
          thumb: item.videoThumbnails ? item.videoThumbnails[0]?.url : `https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg`,
          duration: item.lengthSeconds
        }));
      } else {
        // Piped
        return (data.items || []).map(item => ({
          id: item.url ? item.url.replace('/watch?v=', '') : '',
          title: item.title,
          uploader: item.uploaderName,
          thumb: item.thumbnail,
          duration: item.duration
        }));
      }
    }

    function renderResults(items) {
      resultsContainer.innerHTML = '';

      items.slice(0, 8).forEach(item => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <img class="video-thumb" src="${item.thumb}" alt="thumb" loading="lazy" onError="this.src='https://placehold.co/100x56?text=No+Img'" />
          <div class="video-info">
            <div class="video-title" title="${item.title}">${item.title}</div>
            <div class="video-meta">${item.uploader || 'YouTube'} • ${formatDuration(item.duration)} • ID: <code>${item.id}</code></div>
          </div>
        `;

        resultsContainer.appendChild(card);
      });
    }

    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  </script>
</body>
</html>
